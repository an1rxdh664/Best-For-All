  local-overpass:
      image: wiktorn/overpass-api
      container_name: local_overpass
      environment:
        OVERPASS_MODE: init
        OVERPASS_META: "no"
        OVERPASS_PLANET_URL: https://download.geofabrik.de/asia/india-latest.osm.pbf
        OVERPASS_DIFF_URL: https://download.geofabrik.de/asia/india-updates/
        OVERPASS_RULES_LOAD: 60
        OVERPASS_STOP_AFTER_INIT: "false"
      volumes:
        - overpass_db:/db
      ports:
        - "8080:80"
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost/api/status"]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 5m

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]

  nlp-service:
    build: ./nlp
    env_file:
      - ./nlp/.env
    environment:
      OVERPASS_URL: http://local-overpass:80/api/interpreter
    depends_on:
      local-overpass:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: .
    env_file:
      - .env
      - .env.local
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      nlp-service:
        condition: service_healthy
    environment:
      NLP_SERVICE_URL: http://nlp-service:8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_URL_INTERNAL: ${AUTH_URL_INTERNAL:-http://web:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: ${NEXTAUTH_URL_INTERNAL:-http://web:3000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "3000:3000"

volumes:
  ollama_models:
  overpass_db: